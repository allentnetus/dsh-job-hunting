name: 功能建议
description: 提议一个范围明确的 Job Hunting 改进。
title: "[功能] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请勿包含简历、凭证、Cookie、Token 或私人岗位数据。功能必须保持本地优先的隐私边界。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 需要解决什么用户问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为
      description: 描述最小可用行为和验收标准。
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 隐私与安全影响
      description: 说明对 Workspace 数据、[Tencent/BrowserSkill](https://github.com/Tencent/BrowserSkill)、凭证、自动化或快捷方式的影响。
    validations:
      required: true
