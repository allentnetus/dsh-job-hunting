name: Release package validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate prebuilt package
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release contents
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, stat } from 'node:fs/promises';
          import { join, relative } from 'node:path';

          const manifest = JSON.parse(await readFile('package.json', 'utf8'));
          const changelog = await readFile('CHANGELOG.md', 'utf8');
          const pluginPatch = await readFile('cordis.patch.yml', 'utf8');
          const scheduleOverlay = await readFile('dsh-schedule.cordis.yml', 'utf8');
          const required = [
            'dist/src/index.js',
            'dist/src/index.d.ts',
            'dist/src/skill/job-hunting.skill.js',
            'templates/default/index.html',
            'dsh.bundle',
            'cordis.patch.yml',
            'dsh-schedule.cordis.yml',
          ];
          for (const file of required) {
            try {
              await stat(file);
            } catch {
              throw new Error(`Missing required release file: ${file}`);
            }
          }

          if (manifest.scripts || manifest.devDependencies) {
            throw new Error('Release package must not reference source-only scripts or devDependencies');
          }
          if (manifest.files?.includes('dsh-schedule.cordis.yml')) {
            throw new Error('Host-level Schedule overlay must stay outside the npm package files list');
          }
          if (pluginPatch.includes('@deepseek-ai/dsh-schedule')) {
            throw new Error('Default plugin patch must not enable native DSH Schedule');
          }
          if (!scheduleOverlay.includes('@deepseek-ai/dsh-schedule')) {
            throw new Error('Schedule overlay must enable native DSH Schedule explicitly');
          }

          const forbidden = /^(?:src|tests|scripts|node_modules|\.superpowers)(?:[\\/]|$)|(?:^|[\\/])(?:pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|vitest\.config\.ts)$/;
          const files = [];
          async function walk(dir) {
            for (const entry of await readdir(dir, { withFileTypes: true })) {
              if (dir === '.' && entry.name === '.git') continue;
              const path = join(dir, entry.name);
              if (entry.isDirectory()) await walk(path);
              else files.push(relative('.', path).replaceAll('\\\\', '/'));
            }
          }
          await walk('.');
          const unexpected = files.filter((file) => forbidden.test(file));
          if (unexpected.length) throw new Error(`Source-only files found: ${unexpected.join(', ')}`);
          if (!changelog.includes(`## ${manifest.version}`)) {
            throw new Error(`CHANGELOG.md has no section for package version ${manifest.version}`);
          }
          console.log(`Validated ${files.length} release files for ${manifest.name}@${manifest.version}`);
          NODE

      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Check whitespace errors
        run: git diff --check

  secret-scan:
    name: Scan complete Git history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
