# Optional host-level overlay for DSH's native, session-local Schedule.
# Apply it at launch with:
#   dsh.cmd web --patch '<OVERLAY_PATH>'
#
# This overlay deliberately stays outside the plugin bundle so the default
# Job Hunting installation remains schedule-free until the operator opts in.
- insert:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
